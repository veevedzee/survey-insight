# Runs on every push and pull request (free for public repositories).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install "torch~=2.15.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../sample_data
      - name: Test
        run: pytest --cov=survey_insight --cov-report=term-missing

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build the Hugging Face image
        run: docker build -t survey-insight-api .
      - name: Smoke test the container
        run: |
          docker run -d -p 7860:7860 --name api survey-insight-api
          for i in $(seq 1 30); do
            curl -fs http://localhost:7860/api/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
