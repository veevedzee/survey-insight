# Runs on every push and pull request (free for public repositories).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../sample_data
      - name: Test
        run: pytest --cov=survey_insight --cov-report=term-missing
      - name: Server starts and stays small (Render free tier has 512 MB)
        run: |
          uvicorn survey_insight.api:app --port 8000 &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && break; sleep 1; done
          # Load the sample survey, then check the server's memory (about 200 MB locally).
          curl -fs -X POST http://localhost:8000/api/sessions/sample > /dev/null
          rss_kb=$(ps -o rss= -p "$(pgrep -f 'uvicorn survey_insight')")
          echo "Server memory: $((rss_kb / 1024)) MB"
          test "$rss_kb" -lt 400000

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
